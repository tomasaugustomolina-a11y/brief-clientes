name = "brief-clientes"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# Conserva las variables cargadas a mano en el panel de Cloudflare al publicar.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

# La contraseña de /admin se carga en Cloudflare como secreto ADMIN_PASSWORD
# (Settings > Variables and Secrets), no en este archivo.

[[d1_databases]]
binding = "DB"
database_name = "brief-clientes"
database_id = "1ff06bbc-aa6a-45eb-b820-33b9b80a415f"
