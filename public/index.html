<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<title>Brief de marca personal | Tomi</title>
<meta name="description" content="Unas preguntas cortas para conocerte antes de armar tu estrategia de marca personal.">
<meta property="og:title" content="Brief de marca personal">
<meta property="og:description" content="Unas preguntas cortas para conocerte antes de armar tu estrategia de marca personal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<script src="/tema.js"></script>
<style>
/*
  Identidad Tomi. 60/30/10: papel blanco, tinta negra, azul eléctrico solo donde algo está elegido o avanza.
  Anton para la pregunta (lo único fuerte de la pantalla), Tinos para todo lo demás.
  Una pregunta por pantalla, alineada a la izquierda; entra desde abajo como un feed vertical.
*/
:root {
  --paper: #FFFFFF;
  --ink: #000000;
  --electric: #2323FF;
  --electric-text: #2323FF;
  --on-electric: #FFFFFF;
  --muted: #5B5B66;
  --veil: rgba(0, 0, 0, 0.08);
  --display: "Anton", Impact, "Arial Narrow", sans-serif;
  --text: "Tinos", "Times New Roman", Times, serif;
  --ease: cubic-bezier(0.22, 0.8, 0.2, 1);
  --gutter-l: max(20px, env(safe-area-inset-left, 0px));
  --gutter-r: max(20px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #000000; --ink: #FFFFFF; --electric: #4D4DFF; --electric-text: #7C7CFF; --on-electric: #FFFFFF;
    --muted: #A3A3AD; --veil: rgba(255, 255, 255, 0.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #000000; --ink: #FFFFFF; --electric: #4D4DFF; --electric-text: #7C7CFF; --on-electric: #FFFFFF;
  --muted: #A3A3AD; --veil: rgba(255, 255, 255, 0.14);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--text); font-size: 19px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  transition: background-color .3s, color .3s;
}
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

.app {
  /* El alto sigue al área visible: con el teclado abierto, "Siguiente" queda arriba del teclado. */
  height: 100vh; height: var(--app-h, 100dvh);
  transform: translateY(var(--app-top, 0px));
  max-width: 640px; margin: 0 auto;
  display: grid; grid-template-rows: auto 1fr auto;
  padding-top: env(safe-area-inset-top, 0px);
}

/* Arriba: firma, tema y en qué sección estás */
.top { padding: 14px var(--gutter-r) 0 var(--gutter-l); display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 16px; }
.theme {
  width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
  border: 2px solid var(--ink); background: transparent; display: grid; place-items: center;
}
.theme svg { width: 18px; height: 18px; }
.where { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sec { font-weight: 700; font-size: 18px; line-height: 24px; height: 24px; overflow: hidden; display: flex; justify-content: space-between; gap: 12px; }
.sec .part { color: var(--muted); font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sec > span { display: block; }
#secName { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.part .s { display: none; }
@media (max-width: 359px) { .part .l { display: none; } .part .s { display: inline; } }
.bar { height: 4px; border-radius: 2px; background: var(--veil); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--electric); border-radius: 2px; transition: width .5s var(--ease); }

/* La pantalla de cada pregunta */
.stage { position: relative; overflow: hidden; }
.stage::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 44px; pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--paper)); opacity: 0; transition: opacity .25s;
}
.stage.more::after { opacity: 1; }
.morebtn {
  position: absolute; left: 50%; bottom: 10px; z-index: 2; transform: translate(-50%, 8px);
  display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 7px 16px 7px 18px; cursor: pointer;
  border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--ink);
  font-size: 16px; font-weight: 700; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s var(--ease);
}
.morebtn svg { width: 16px; height: 16px; }
.stage.more .morebtn { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
.app.tight .morebtn { display: none; }

/* En compu: el botón queda justo debajo de la pregunta, no al fondo de la pantalla. */
@media (min-width: 900px) and (min-height: 600px) {
  .app { grid-template-rows: auto auto auto; align-content: start; padding-top: 6vh; }
  .stage > .card { bottom: auto; max-height: 100%; }
  .stage { transition: height .7s cubic-bezier(.76,0,.24,1); }
}
@media (prefers-reduced-motion: reduce) { .stage { transition: none; } }
.card {
  position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 28px var(--gutter-r) 28px var(--gutter-l);
  display: flex; flex-direction: column; gap: 18px;
}
.q {
  margin: 0; font-family: var(--display); font-weight: 400;
  font-size: clamp(36px, 10.5vw, 60px); line-height: 0.98; letter-spacing: 0.005em;
  text-transform: uppercase; text-wrap: balance; overflow-wrap: break-word;
}
.q:focus { outline: none; }
.q .w { display: inline-block; }
.hint { margin: -4px 0 0; font-weight: 700; color: var(--ink); font-size: 18px; }
.hint.shake { color: var(--electric-text); }
.lead { margin: 0; font-size: 20px; max-width: 34ch; }
.sign { margin: -6px 0 0; font-size: 22px; font-style: italic; font-weight: 700; color: var(--electric-text); }
.tip { margin: auto 0 0; padding-top: 12px; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; color: var(--muted); }
.tip svg { width: 22px; height: 22px; flex: none; }

.opts { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.opts.chips { flex-direction: row; flex-wrap: wrap; }
.opt {
  cursor: pointer; text-align: left; font-size: 19px; line-height: 1.25;
  background: transparent; border: 2px solid var(--ink); border-radius: 16px;
  padding: 13px 16px; min-height: 52px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  transition: background-color .18s, border-color .18s, color .18s, transform .18s var(--ease);
}
.chips .opt { border-radius: 999px; padding: 11px 18px; min-height: 48px; }
.opt:active { transform: scale(0.97); }
.opt .tick { width: 18px; height: 18px; flex: none; display: none; }
.opt[aria-pressed="true"] { background: var(--electric); border-color: var(--electric); color: var(--on-electric); }
.opt[aria-pressed="true"] .tick { display: block; }
.opt.otro { border-style: dashed; }
.opt.otro[aria-pressed="true"] { border-style: solid; }
@media (hover: hover) { .opt:hover { border-color: var(--electric); } }

.line {
  width: 100%; font: inherit; font-size: 24px; color: var(--ink); background: transparent;
  border: 0; border-bottom: 2px solid var(--ink); border-radius: 0; padding: 10px 2px; outline: none;
}
textarea.line { resize: none; min-height: 132px; line-height: 1.35; font-size: 21px; }
.line::placeholder { color: var(--muted); opacity: 1; }
.line:focus { border-bottom-color: var(--electric); }
.err { margin: 0; font-size: 17px; font-weight: 700; color: var(--electric-text); }

@media (max-height: 700px) {
  .opts { gap: 8px; }
  .opt { padding: 10px 14px; min-height: 46px; font-size: 18px; }
  .card { gap: 14px; padding-top: 20px; }
}
/* Teclado abierto: se esconde la firma para dejar lugar a la pregunta, el campo y el botón. */
.app.tight .theme { display: none; }
.app.tight .top { padding-top: 8px; }
.app.tight .card { padding-top: 14px; padding-bottom: 14px; gap: 12px; }
.app.tight .q { font-size: clamp(28px, 8vw, 40px); }
.app.tight .foot { padding-bottom: 10px; }

/* Abajo: volver y seguir */
.foot {
  display: flex; gap: 10px; align-items: center;
  padding: 12px var(--gutter-r) max(16px, env(safe-area-inset-bottom, 0px)) var(--gutter-l);
}
.back {
  width: 56px; height: 56px; flex: none; border-radius: 50%; cursor: pointer;
  background: transparent; border: 2px solid var(--ink); display: grid; place-items: center;
}
.back svg { width: 22px; height: 22px; }
.next {
  flex: 1; height: 56px; border-radius: 999px; cursor: pointer; border: 0;
  background: var(--ink); color: var(--paper);
  font-family: var(--display); font-size: 22px; letter-spacing: 0.03em; text-transform: uppercase;
  transition: opacity .2s, background-color .2s;
}
.next[aria-disabled="true"] { opacity: 0.35; }
.next.busy { opacity: 0.6; cursor: progress; }
.restart { align-self: flex-start; background: none; border: 0; padding: 4px 0; cursor: pointer; font-style: italic; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 17px; }

.theme:focus-visible, .opt:focus-visible, .next:focus-visible, .back:focus-visible, .restart:focus-visible { outline: 3px solid var(--electric); outline-offset: 3px; }

/* Final */
.done-mark { width: 92px; height: 92px; }
.done-mark circle { fill: var(--electric); }
.done-mark path { fill: none; stroke: var(--on-electric); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 0; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

@media (prefers-reduced-motion: no-preference) {
  .card.reveal .q .w { animation: rise .55s var(--ease) both; animation-delay: calc(var(--i) * 45ms + 120ms); }
  .card.reveal .opts .opt, .card.reveal .line { animation: fadeup .45s var(--ease) both; animation-delay: calc(var(--j, 0) * 35ms + 260ms); }
  .hint.shake { animation: shake .35s; }
  .done-mark circle { animation: pop .5s var(--ease) both; }
  .done-mark path { stroke-dashoffset: 60; animation: draw .45s .35s var(--ease) forwards; }
  @keyframes rise { from { transform: translateY(0.7em); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fadeup { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @keyframes pop { from { transform: scale(0.4); transform-origin: center; opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* Al abrir: el saludo se enciende letra por letra, como un cartel luminoso. Después aparece el resto. */
  .card.cartel .q .l { opacity: .1; }
  .card.cartel .lead, .card.cartel .sign, .card.cartel .restart, .card.cartel .tip, .app.boot .foot { opacity: 0; }
  .card.cartel.on .q .l { animation: lit .95s both; animation-delay: var(--d, 0ms); }
  .card.cartel.on .q .l.falla { animation: lit2 1.5s both; animation-delay: var(--d, 0ms); }
  .card.cartel.on .lead, .card.cartel.on .sign, .card.cartel.on .restart, .card.cartel.on .tip, .app.boot.on .foot { animation: fadeup .5s var(--ease) both; }
  .card.cartel.on .lead { animation-delay: 820ms; }
  .card.cartel.on .sign { animation-delay: 950ms; }
  .card.cartel.on .restart { animation-delay: 1020ms; }
  .card.cartel.on .tip, .app.boot.on .foot { animation-delay: 1080ms; }
  @keyframes lit {
    0%, 12%  { opacity: .1; color: var(--ink); text-shadow: none; }
    13%, 20% { opacity: 1; color: var(--electric-text); text-shadow: 0 0 .3em var(--electric); }
    21%, 34% { opacity: .1; text-shadow: none; }
    35%, 41% { opacity: 1; color: var(--electric-text); text-shadow: 0 0 .3em var(--electric); }
    42%, 48% { opacity: .4; text-shadow: none; }
    49%      { opacity: 1; color: var(--electric-text); text-shadow: 0 0 .4em var(--electric); }
    100%     { opacity: 1; color: var(--ink); text-shadow: 0 0 0 transparent; }
  }
  /* Una letra tarda más en prender, como un tubo flojo. */
  @keyframes lit2 {
    0%, 14%  { opacity: .1; color: var(--ink); text-shadow: none; }
    15%, 18% { opacity: 1; color: var(--electric-text); text-shadow: 0 0 .3em var(--electric); }
    19%, 36% { opacity: .1; text-shadow: none; }
    37%, 40% { opacity: 1; color: var(--electric-text); text-shadow: 0 0 .3em var(--electric); }
    41%, 55% { opacity: .1; text-shadow: none; }
    56%, 60% { opacity: 1; color: var(--electric-text); text-shadow: 0 0 .3em var(--electric); }
    61%, 67% { opacity: .35; text-shadow: none; }
    68%      { opacity: 1; color: var(--electric-text); text-shadow: 0 0 .4em var(--electric); }
    100%     { opacity: 1; color: var(--ink); text-shadow: 0 0 0 transparent; }
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="where" id="where">
      <div class="sec"><span id="secName" aria-live="polite"></span><span class="part" id="secPart"></span></div>
      <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    </div>
    <button type="button" class="theme" id="themeBtn" aria-label="Cambiar a modo oscuro">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
    </button>
  </header>
  <main class="stage" id="stage">
    <button type="button" class="morebtn" id="moreBtn" tabindex="-1" aria-hidden="true">Más opciones<svg viewBox="0 0 24 24"><path d="M12 5v14M5.5 12.5L12 19l6.5-6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </main>
  <footer class="foot" id="foot">
    <button type="button" class="back" id="backBtn" aria-label="Pregunta anterior" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 20v-8a4 4 0 0 0-4-4H5M9.5 3.5L5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="next" id="nextBtn">Empezar</button>
  </footer>
  <input class="hp" id="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
</div>

<script src="/preguntas.js"></script>
<script src="/app.js"></script>
</body>
</html>
